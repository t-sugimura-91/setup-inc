<style>
  :root{
    --navy:#091E41; --navy-lift:#16345F; --gold:#C19746; --gold-deep:#8F6B26;
    --paper:#F3F4F6; --ink:#14203A; --muted:#616B80; --rule:#D8DCE4;
    --serif:"Shippori Mincho B1", serif;
    --sans:"Zen Kaku Gothic New", system-ui, sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, monospace;
    --logo-mark:url("/img/logo-mark.png");
    --logo-word:url("/img/logo-word.png");
  }
  *{box-sizing:border-box;}
  body{margin:0; background:#fff; color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.95; -webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--gold-deep); outline-offset:3px;}
  img{max-width:100%;}
  .wrap{max-width:1060px; margin:0 auto; padding:0 clamp(22px,5vw,44px);}

  .head{border-bottom:1px solid var(--rule); background:rgba(255,255,255,.94); backdrop-filter:blur(6px); position:sticky; top:0; z-index:20;}
  .head .wrap{display:flex; align-items:center; justify-content:space-between; gap:20px; height:70px;}
  .brand{display:flex; align-items:center; gap:12px; text-decoration:none;}
  .logo-mark{background:var(--logo-mark) center/contain no-repeat; height:30px; aspect-ratio:200/134; flex:none;}
  .logo-word{background:var(--logo-word) center/contain no-repeat; height:15px; aspect-ratio:340/52; flex:none;}
  .vh{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
  .head .sub{font-family:var(--serif); font-size:15px; color:var(--navy); letter-spacing:.06em;}

  .label{display:flex; align-items:center; gap:11px; font-size:12.5px; font-weight:500; letter-spacing:.16em; color:var(--gold-deep); margin:0 0 18px;}
  .label::before{content:""; width:26px; height:2px; background:var(--gold); flex:none;}
  .cat{display:inline-block; font-size:11.5px; letter-spacing:.08em; color:var(--gold-deep); border:1px solid var(--gold); border-radius:2px; padding:2px 10px; line-height:1.7;}
  .date{font-family:var(--mono); font-size:11.5px; letter-spacing:.06em; color:var(--muted);}


  .crumb{font-size:12.5px; color:var(--muted); padding-top:28px;}
  .crumb a{text-decoration:none;} .crumb a:hover{color:var(--navy);}

  .art{max-width:720px; margin:0 auto; padding:0 clamp(22px,5vw,44px) clamp(70px,9vw,110px);}
  .art-head{padding:26px 0 clamp(34px,4vw,48px); border-bottom:1px solid var(--rule); margin-bottom:clamp(34px,4vw,48px);}
  .art-meta{display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:20px;}
  .art h1{font-family:var(--serif); font-size:clamp(25px,3.6vw,36px); line-height:1.55; color:var(--navy); margin:0 0 22px; letter-spacing:.01em;}
  .art-lead{font-size:15.5px; color:var(--muted); margin:0;}

  .toc{background:var(--paper); border-left:2px solid var(--gold); padding:24px 26px; margin:0 0 clamp(40px,5vw,56px);}
  .toc b{display:block; font-size:13px; letter-spacing:.1em; color:var(--navy); margin-bottom:12px;}
  .toc ol{margin:0; padding-left:1.3em;}
  .toc li{font-size:14px; color:var(--muted); padding:3px 0;}
  .toc a{text-decoration:none;} .toc a:hover{color:var(--navy);}

  .body{font-size:16px; line-height:2.15;}
  .body h2{font-family:var(--serif); font-size:clamp(20px,2.5vw,25px); line-height:1.6; color:var(--navy); margin:clamp(52px,6vw,72px) 0 22px; padding-top:20px; border-top:2px solid var(--gold);}
  .body h3{font-family:var(--serif); font-size:18px; font-weight:500; color:var(--navy); margin:40px 0 14px;}
  .body p{margin:0 0 1.6em;}
  .body ul, .body ol{margin:0 0 1.8em; padding-left:1.4em;}
  .body li{margin-bottom:.7em;}
  .body strong{font-weight:700; background:linear-gradient(transparent 62%, rgba(193,151,70,.28) 62%);}
  .body blockquote{margin:0 0 1.8em; padding:4px 0 4px 24px; border-left:2px solid var(--rule); color:var(--muted); font-size:15px;}
  .body figure{margin:0 0 1.8em;}
  .body figure img{display:block; width:100%; border:1px solid var(--rule);}
  .body figcaption{font-size:12.5px; color:var(--muted); margin-top:10px;}
  .note{background:var(--paper); padding:22px 26px; font-size:14.5px; color:var(--muted); line-height:1.95; margin:0 0 1.8em;}
  .note b{display:block; color:var(--navy); font-weight:500; margin-bottom:6px;}
  .body table{width:100%; border-collapse:collapse; font-size:14.5px; margin:0 0 1.8em;}
  .body th, .body td{border-bottom:1px solid var(--rule); padding:13px 12px; text-align:left; vertical-align:top;}
  .body th{color:var(--navy); font-weight:500; white-space:nowrap;}
  .body td{color:var(--muted);}

  .author{display:flex; gap:20px; align-items:flex-start; margin-top:clamp(56px,7vw,80px); padding-top:32px; border-top:1px solid var(--rule);}
  .author .who{font-family:var(--serif); font-size:16px; color:var(--navy); margin:0 0 6px;}
  .author p{font-size:13.5px; color:var(--muted); margin:0; line-height:1.9;}

  .back{display:inline-block; margin-top:40px; font-size:13.5px; color:var(--muted); text-decoration:none;}
  .back:hover{color:var(--navy);}

  footer{background:var(--paper); border-top:1px solid var(--rule); padding:44px 0 52px;}
  footer .wrap{display:flex; flex-wrap:wrap; gap:20px 40px; justify-content:space-between; align-items:center;}
  footer p{font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:.06em; margin:0;}

  /* アフィリエイト記事用 */
  .pr{display:inline-block; font-family:var(--mono); font-size:11px; font-weight:500; letter-spacing:.1em; color:#fff; background:var(--muted); border-radius:2px; padding:2px 9px; line-height:1.7;}
  .pr-note{font-size:13px; color:var(--muted); background:var(--paper); padding:12px 16px; margin:0 0 22px; line-height:1.8;}
  .tbl{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 0 1.8em;}
  .tbl table{margin:0; min-width:520px;}
  .tbl caption{caption-side:bottom; text-align:left; font-size:12.5px; color:var(--muted); padding-top:10px; line-height:1.8;}
  .body thead th{border-bottom:2px solid var(--navy);}
  .pick{border:1px solid var(--rule); border-top:2px solid var(--navy); padding:24px 26px 26px; margin:0 0 1.8em;}
  .pick h3{margin:0 0 8px;}
  .pick p{font-size:15px; margin:0 0 1em;}
  .pick ul{font-size:15px; margin:0 0 1.2em;}
  .eyecatch{margin:0 0 24px; line-height:0;}
  .eyecatch svg, .eyecatch img{display:block; width:100%; height:auto;}
  .bnr{margin:0 0 18px; line-height:0;}
  .bnr img{max-width:100%; height:auto;}
  .btn{display:inline-block; background:var(--navy); color:#fff; text-decoration:none; font-size:14.5px; font-weight:500; letter-spacing:.04em; padding:12px 26px; border-radius:2px;}
  .btn:hover{background:var(--navy-lift);}
  .btn::after{content:" →";}
  .faq dt{font-weight:700; color:var(--navy); margin:0 0 6px;}
  .faq dd{margin:0 0 1.6em; color:var(--ink);}
  .refs{font-size:13px; color:var(--muted); line-height:1.9;}
  .refs li{margin-bottom:.3em;}
</style>
</head>
