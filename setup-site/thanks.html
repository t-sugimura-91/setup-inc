  *{box-sizing:border-box;}
  body{margin:0; background:#fff; color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.95; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; min-height:100vh;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--gold-deep); outline-offset:3px;}
  .wrap{max-width:1060px; margin:0 auto; padding:0 clamp(22px,5vw,44px); width:100%;}

  .head{border-bottom:1px solid var(--rule);}
  .head .wrap{display:flex; align-items:center; height:70px;}
  .brand{display:flex; align-items:center; gap:12px; text-decoration:none;}
  .logo-mark{background:var(--logo-mark) center/contain no-repeat; height:30px; aspect-ratio:200/134;}
  .logo-word{background:var(--logo-word) center/contain no-repeat; height:15px; aspect-ratio:340/52;}
  .vh{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);}

  main{flex:1; display:flex; align-items:center; padding-block:clamp(60px,10vw,120px);}
  .inner{max-width:600px;}
  .icon{width:52px; height:52px; margin-bottom:30px;}
  h1{font-family:var(--serif); font-size:clamp(26px,3.8vw,36px); line-height:1.5; color:var(--navy); margin:0 0 22px;}
  p{margin:0 0 1.3em; color:var(--muted); font-size:15px;}
  p:last-of-type{margin-bottom:0;}
  .box{background:var(--paper); border-left:2px solid var(--gold); padding:22px 26px; margin:34px 0 0; font-size:14px; line-height:1.95;}
  .box b{display:block; color:var(--navy); font-weight:500; margin-bottom:5px;}
  .back{display:inline-block; margin-top:40px; font-size:14px; text-decoration:none; border:1px solid var(--navy); color:var(--navy); padding:13px 28px; border-radius:2px; transition:.18s ease;}
  .back:hover{background:var(--navy); color:#fff;}

  footer{background:var(--paper); border-top:1px solid var(--rule); padding:36px 0 42px;}
  footer .wrap{display:flex; flex-wrap:wrap; gap:18px 40px; justify-content:space-between; align-items:center;}
  .foot-end{display:flex; flex-wrap:wrap; align-items:center; gap:10px 26px;}
  .foot-link{font-size:12.5px; color:var(--muted); text-decoration:none;}
  .foot-link:hover{color:var(--navy);}
  footer p{font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:.06em; margin:0;}
